services:
  - type: web
    name: url-shortener-api
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false   # set in Render dashboard
      - key: CLIENT_URL
        sync: false   # your Vercel frontend URL
      - key: BASE_URL
        sync: false   # your Render service URL
      - key: PORT
        value: 10000
